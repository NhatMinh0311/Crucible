#cloud-config
# Máy phiên cr-lab (CR-DOC-04 mục 3; ADR-0003, ADR-0009). Mẫu: infra/create-vms.sh thay các giá trị @...@ khi dựng.
hostname: cr-lab
timezone: Asia/Ho_Chi_Minh

groups: [docker]

users:
  - name: ops
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "@ADMIN_SSH_PUBKEY@"
  # Tài khoản của runtime-api: khóa chỉ dùng được để chuyển tiếp tới Docker Engine (CR-DOC-05 T2)
  - name: crucible
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - 'restrict,command="docker system dial-stdio" @RUNTIME_API_PUBKEY@'

ssh_pwauth: false

# Đĩa thứ hai dành riêng cho /var/lib/docker
fs_setup:
  - label: docker
    filesystem: ext4
    device: /dev/vdb
    partition: none
    overwrite: false
mounts:
  - [LABEL=docker, /var/lib/docker, ext4, "defaults,nofail", "0", "2"]

package_update: true
packages: [ca-certificates, curl, gnupg, ufw, prometheus-node-exporter]

write_files:
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "runtimes": {
          "runsc": {"path": "/usr/bin/runsc", "runtimeArgs": ["--platform=systrap"]}
        },
        "default-runtime": "runsc",
        "no-new-privileges": true,
        "icc": false,
        "live-restore": true,
        "default-address-pools": [{"base": "172.30.0.0/16", "size": 28}],
        "log-driver": "local",
        "log-opts": {"max-size": "1m"}
      }
  - path: /opt/crucible/bootstrap.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      install -m 0755 -d /etc/apt/keyrings

      # gVisor cài trước Docker để runtime mặc định runsc có sẵn khi Docker Engine khởi động
      curl -fsSL https://gvisor.dev/archive.key | gpg --dearmor -o /etc/apt/keyrings/gvisor.gpg
      echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/gvisor.gpg] https://storage.googleapis.com/gvisor/releases release main" \
        > /etc/apt/sources.list.d/gvisor.list

      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" \
        > /etc/apt/sources.list.d/docker.list

      apt-get update
      apt-get install -y runsc
      apt-get install -y docker-ce docker-ce-cli containerd.io

      # Tường lửa: chỉ nhận SSH từ cr-server và máy vật lý; node-exporter chỉ từ cr-server (CR-DOC-04 mục 3.3)
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow from 10.77.0.10 to any port 22 proto tcp
      ufw allow from 10.77.0.1 to any port 22 proto tcp
      ufw allow from 10.77.0.10 to any port 9100 proto tcp
      ufw --force enable

runcmd:
  - [bash, /opt/crucible/bootstrap.sh]
