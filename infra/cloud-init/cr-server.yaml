#cloud-config
# Máy nền tảng cr-server (CR-DOC-04 mục 3; ADR-0009). Mẫu: infra/create-vms.sh thay các giá trị @...@ khi dựng.
hostname: cr-server
timezone: Asia/Ho_Chi_Minh

groups: [docker]

users:
  - name: ops
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "@ADMIN_SSH_PUBKEY@"

ssh_pwauth: false

package_update: true
packages: [ca-certificates, curl, gnupg]

write_files:
  - path: /etc/hosts
    append: true
    content: |
      10.77.0.11 cr-lab
  # Khóa SSH của runtime-api để điều khiển Docker Engine của cr-lab (CR-DOC-05 T2)
  - path: /opt/crucible/ssh/runtime-api
    permissions: "0600"
    owner: ops:ops
    encoding: b64
    content: "@RUNTIME_API_KEY_B64@"
    defer: true
  - path: /home/ops/.ssh/config
    permissions: "0600"
    owner: ops:ops
    defer: true
    content: |
      Host cr-lab
        User crucible
        IdentityFile /opt/crucible/ssh/runtime-api
        IdentitiesOnly yes
        StrictHostKeyChecking accept-new
  - path: /opt/crucible/bootstrap.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" \
        > /etc/apt/sources.list.d/docker.list
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

runcmd:
  - [bash, /opt/crucible/bootstrap.sh]
