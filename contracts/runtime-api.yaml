openapi: 3.1.0
info:
  title: Crucible Runtime API (M1)
  version: 1.1.0
  description: |
    API của module M1 (phiên thực hành và tài nguyên) dành cho module M2, M3 và giao diện.
    Quy ước chung (xác thực, lỗi, lặp lại an toàn, phiên bản) tại CR-DOC-03.

    Terminal không mô tả được bằng OpenAPI; giao thức WebSocket tại CR-DOC-03 mục 6.

    Operation chưa được hiện thực trả 501 `NOT_IMPLEMENTED` (CR-DOC-03 mục 2.3).
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: https://crucible.local/api/runtime
    description: Môi trường chuẩn
security:
  - oidc: []
tags:
  - name: sessions
    description: Phiên thực hành
  - name: terminal
    description: Vé truy cập terminal
  - name: reservations
    description: Đặt trước tài nguyên cho kỳ thi
  - name: quota
    description: Hạn mức giờ máy
  - name: capacity
    description: Sức chứa của máy chạy phiên
  - name: settings
    description: Tham số hệ thống do quản trị viên chỉnh

paths:
  /v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Tạo phiên
      description: |
        Nhận yêu cầu và trả về ngay với pha `PENDING`. Trạng thái tiếp theo được thông báo qua sự kiện
        `runtime.session.*` và đọc được bằng `getSession`. Scope yêu cầu: `runtime.sessions.write`.
      security:
        - oidc: [runtime.sessions.write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '202':
          description: Đã tiếp nhận
          headers:
            Location:
              description: Đường dẫn của phiên
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '402':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: getSession
      summary: Đọc trạng thái phiên
      description: Chủ phiên hoặc tài khoản dịch vụ có scope `runtime.sessions.read`.
      responses:
        '200':
          description: Phiên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/extend:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: extendSession
      summary: Gia hạn phiên
      description: Không áp dụng cho phiên `EXAM`. Tổng thời gian gia hạn không vượt `maxExtensionMinutes`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [minutes]
              properties:
                minutes:
                  type: integer
                  minimum: 5
                  maximum: 60
      responses:
        '200':
          description: Phiên sau khi gia hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/terminate:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: terminateSession
      summary: Kết thúc phiên
      description: Idempotent; kết thúc phiên đã kết thúc trả về trạng thái hiện tại.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [COMPLETED, CANCELLED, ADMIN]
      responses:
        '200':
          description: Phiên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/exec:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: execInSession
      summary: Chạy lệnh kiểm tra hoặc script khôi phục trong phiên
      description: |
        Chỉ tài khoản dịch vụ có scope `runtime.exec` (cấp cho M2). Với `purpose = CHECK`, script chạy bằng
        `/opt/crucible/bin/sh`, `PATH=/opt/crucible/bin`, không nạp tệp cấu hình shell, môi trường biến rỗng (ADR-0011).

        Script phải in xong kết luận trước khi tiến trình chính của nó thoát và không để lại tiến trình nền giữ đầu ra;
        quy định và lý do tại CR-DOC-03 mục 7.
      security:
        - oidc: [runtime.exec]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
      responses:
        '200':
          description: Kết quả chạy, kể cả khi mã thoát khác 0 hoặc hết thời gian
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResult'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/terminal-tickets:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [terminal]
      operationId: createTerminalTicket
      summary: Cấp vé terminal tương tác
      description: Chỉ chủ phiên (người dùng có `sub` trùng `ownerRef.userId`). Vé dùng một lần, hết hạn sau 30 giây.
      parameters:
        - $ref: '#/components/parameters/Machine'
      responses:
        '201':
          description: Vé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalTicket'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/view-tickets:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [terminal]
      operationId: createViewTicket
      summary: Cấp vé xem chỉ đọc
      description: |
        Tài khoản dịch vụ có scope `runtime.view` (cấp cho M3). M3 kiểm tra quyền của giảng viên đối với lớp
        trước khi gọi; M1 ghi nhận `viewerUserId` vào nhật ký truy cập.
      security:
        - oidc: [runtime.view]
      parameters:
        - $ref: '#/components/parameters/Machine'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [viewerUserId]
              properties:
                viewerUserId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Vé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalTicket'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/recording:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: getRecording
      summary: Lấy đường dẫn tải bản ghi phiên
      description: Tài khoản dịch vụ có scope `runtime.recordings.read`. Đường dẫn ký sẵn, hết hạn sau 5 phút.
      security:
        - oidc: [runtime.recordings.read]
      responses:
        '200':
          description: Đường dẫn bản ghi
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt, durationSeconds]
                properties:
                  url:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
                  durationSeconds:
                    type: integer
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/reservations:
    post:
      tags: [reservations]
      operationId: createReservation
      summary: Đặt trước tài nguyên
      description: |
        Scope `runtime.reservations.write`. Từ chối khi sức chứa khả dụng trong khung giờ không đủ: lỗi 409
        `CAPACITY_UNAVAILABLE` kèm trường `capacity` (số chỗ cần, số chỗ còn) để giao diện báo phần thiếu.
        Số chỗ × số giờ của đặt trước được tính vào ngân sách đặt trước trong tháng của tài khoản hạn mức gốc
        (tài khoản cha nếu có); vượt ngân sách trả 402 `RESERVATION_BUDGET_EXHAUSTED`.
      security:
        - oidc: [runtime.reservations.write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
      responses:
        '201':
          description: Đã đặt trước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '402':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/reservations/{reservationId}:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [reservations]
      operationId: getReservation
      summary: Đọc đặt trước
      responses:
        '200':
          description: Đặt trước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [reservations]
      operationId: resizeReservation
      summary: Đổi số chỗ của đặt trước
      description: >-
        Scope `runtime.reservations.write`. Dùng khi sĩ số lớp thay đổi sau khi kỳ thi được lên lịch. Tăng chỗ được kiểm
        tra như tạo đặt trước: sức chứa khả dụng trong khung giờ (409 `CAPACITY_UNAVAILABLE`) và ngân sách chỗ × giờ của
        tài khoản gốc cho phần tăng thêm (402 `RESERVATION_BUDGET_EXHAUSTED`); khi bị từ chối, số chỗ giữ nguyên. Giảm chỗ
        không xuống dưới `slotsInUse` (409 `RESERVATION_SLOTS_IN_USE`); giảm trước `startsAt` hoàn lại ngân sách của phần
        giảm. Đặt trước đã hủy hoặc đã qua `endsAt` trả 409 `RESERVATION_CLOSED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slots]
              properties:
                slots:
                  type: integer
                  minimum: 1
                  maximum: 200
      responses:
        '200':
          description: Đặt trước sau khi đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '402':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [reservations]
      operationId: cancelReservation
      summary: Hủy đặt trước
      description: Phiên đang chạy thuộc đặt trước không bị ảnh hưởng. Hủy trước giờ bắt đầu hoàn lại ngân sách đặt trước.
      responses:
        '204':
          description: Đã hủy
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/capacity:
    get:
      tags: [capacity]
      operationId: getCapacity
      summary: Sức chứa khả dụng trong khung giờ
      parameters:
        - name: profile
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Profile'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Sức chứa
          content:
            application/json:
              schema:
                type: object
                required: [profile, totalSlots, reservedSlots, availableSlots]
                properties:
                  profile:
                    $ref: '#/components/schemas/Profile'
                  totalSlots:
                    type: integer
                  reservedSlots:
                    type: integer
                  availableSlots:
                    type: integer
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/capacity/windows:
    get:
      tags: [capacity]
      operationId: findCapacityWindows
      summary: Tìm khung giờ còn đủ sức chứa
      description: |
        Trả các khung giờ gần nhất, bắt đầu từ `from`, có độ dài `durationMinutes` và còn ít nhất `slots` chỗ cho
        `profile`. Khung giờ bắt đầu tại các mốc 30 phút, nằm trọn trong khoảng `dailyStart`–`dailyEnd` theo giờ
        Việt Nam, tìm trong tối đa 14 ngày. Dùng để gợi ý giờ khác khi đặt trước bị từ chối (CR-DOC-10 UC14).
      parameters:
        - name: profile
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Profile'
        - name: slots
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: durationMinutes
          in: query
          required: true
          schema:
            type: integer
            minimum: 15
            maximum: 480
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: dailyStart
          in: query
          schema:
            type: string
            pattern: '^([01][0-9]|2[0-3]):(00|30)$'
            default: '07:00'
        - name: dailyEnd
          in: query
          schema:
            type: string
            pattern: '^([01][0-9]|2[0-3]):(00|30)$'
            default: '21:00'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
      responses:
        '200':
          description: Các khung giờ theo thứ tự thời gian; rỗng khi không tìm thấy trong 14 ngày
          content:
            application/json:
              schema:
                type: object
                required: [windows]
                properties:
                  windows:
                    type: array
                    items:
                      type: object
                      required: [startsAt, endsAt, availableSlots]
                      properties:
                        startsAt:
                          type: string
                          format: date-time
                        endsAt:
                          type: string
                          format: date-time
                        availableSlots:
                          type: integer
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/resource-violations:
    get:
      tags: [capacity]
      operationId: listResourceViolations
      summary: Liệt kê lần phát hiện phiên dùng CPU bất thường
      description: Vai trò `ADMIN`. Sắp theo thời điểm phát hiện, mới nhất trước.
      parameters:
        - name: ownerUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceViolation'
        '403':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /v1/quota-accounts:
    get:
      tags: [quota]
      operationId: listQuotaAccounts
      summary: Liệt kê tài khoản hạn mức
      description: Vai trò `ADMIN` hoặc scope `runtime.quota.write`. Lọc theo tài khoản cha để xem phần đã chia cho các lớp.
      parameters:
        - name: parentRef
          in: query
          schema:
            $ref: '#/components/schemas/Ref'
        - name: rootOnly
          description: Chỉ lấy tài khoản không có tài khoản cha (trần của giảng viên).
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuotaAccount'
        '403':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /v1/quota-accounts/{quotaAccountRef}:
    parameters:
      - name: quotaAccountRef
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ref'
    get:
      tags: [quota]
      operationId: getQuotaAccount
      summary: Đọc hạn mức và mức sử dụng
      responses:
        '200':
          description: Tài khoản hạn mức
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaAccount'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    put:
      tags: [quota]
      operationId: putQuotaAccount
      summary: Tạo hoặc cập nhật hạn mức
      description: |
        Vai trò `ADMIN` ghi mọi tài khoản. Scope `runtime.quota.write` (cấp cho M3) chỉ ghi tài khoản có `parentRef`
        (hạn mức của lớp); tài khoản không có cha là trần của giảng viên, chỉ quản trị đặt được. Tổng `weeklyMinutes`
        của các tài khoản con không vượt `weeklyMinutes` của tài khoản cha (422 `QUOTA_CEILING_EXCEEDED`). Tài khoản cha
        chưa tồn tại được tạo với giá trị mặc định của bản cài đặt.
      security:
        - oidc: [runtime.quota.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [weeklyMinutes, maxConcurrentSessions]
              properties:
                parentRef:
                  $ref: '#/components/schemas/Ref'
                weeklyMinutes:
                  type: integer
                  minimum: 0
                  maximum: 100000
                maxConcurrentSessions:
                  type: integer
                  minimum: 0
                  maximum: 500
                monthlyReservationSlotHours:
                  description: Chỉ với tài khoản không có cha. Ngân sách chỗ × giờ đặt trước cho kỳ thi mỗi tháng.
                  type: integer
                  minimum: 0
                  maximum: 100000
      responses:
        '200':
          description: Tài khoản hạn mức
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaAccount'
        '422':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /v1/settings:
    get:
      tags: [settings]
      operationId: listSettings
      summary: Danh sách tham số hệ thống của module
      description: Chỉ vai trò `ADMIN`. Quy ước chung về tham số hệ thống tại CR-DOC-03 mục 3.6.
      responses:
        '200':
          description: Tham số của module
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Setting'
        '403':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /v1/settings/{key}:
    parameters:
      - $ref: '#/components/parameters/SettingKeyPath'
    put:
      tags: [settings]
      operationId: updateSetting
      summary: Sửa giá trị tham số
      description: >-
        Chỉ vai trò `ADMIN`. Giá trị ngoài khoảng [`minimum`, `maximum`] bị từ chối với 422 `SETTING_OUT_OF_RANGE`.
        Giá trị mới áp dụng cho thao tác mới trong vòng 60 giây, không cần khởi động lại dịch vụ; đối tượng đã tạo
        trước đó không đổi theo (CR-DOC-03 mục 3.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdate'
      responses:
        '200':
          description: Tham số sau khi sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /v1/settings/{key}/history:
    parameters:
      - $ref: '#/components/parameters/SettingKeyPath'
    get:
      tags: [settings]
      operationId: listSettingChanges
      summary: Lịch sử thay đổi của một tham số
      description: Chỉ vai trò `ADMIN`. Mới nhất trước.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Các lần thay đổi
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SettingChange'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://crucible.local/auth/realms/crucible/.well-known/openid-configuration

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Machine:
      name: machine
      in: query
      description: Máy trong môi trường. Phiên bản hiện tại chỉ có `main` (ADR-0015).
      schema:
        $ref: '#/components/schemas/MachineName'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa do bên gọi sinh (UUID). Gửi lại cùng khóa trong 24 giờ trả về cùng kết quả.
      schema:
        type: string
        format: uuid

    SettingKeyPath:
      name: key
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SettingKey'

  responses:
    Problem:
      description: Lỗi theo RFC 9457; mã lỗi trong trường `code` (CR-DOC-03 mục 3)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Ref:
      description: Mã tham chiếu mờ do module gọi đặt, dạng `<loại>:<mã>`, ví dụ `class:42`, `exam:7`.
      type: string
      pattern: '^[a-z]+:[A-Za-z0-9-]{1,64}$'

    Profile:
      type: string
      enum: [small, medium]

    MachineName:
      description: Tên máy trong môi trường. Phiên bản hiện tại chỉ có `main`; môi trường nhiều máy (R14) mở rộng danh sách (ADR-0015).
      type: string
      enum: [main]
      default: main

    Priority:
      type: string
      enum: [EXAM, PRACTICE, LAB_CI]

    Phase:
      type: string
      enum: [PENDING, PROVISIONING, READY, EXPIRING, TERMINATED, FAILED, LOST]

    EndReason:
      description: >-
        `OUT_OF_MEMORY`: môi trường bị dừng vì vượt giới hạn bộ nhớ. `ENVIRONMENT_FAILED`: môi trường dừng ngoài ý muốn vì
        lý do khác (vượt giới hạn số tiến trình, tiến trình chính của môi trường kết thúc, lỗi sandbox).
      type: string
      enum: [COMPLETED, EXPIRED, IDLE, CANCELLED, ADMIN, QUEUE_TIMEOUT, PROVISION_FAILED, NODE_LOST, OUT_OF_MEMORY, ENVIRONMENT_FAILED, RESOURCE_ABUSE]

    Capabilities:
      description: Capability Linux bổ sung cho container phiên, chỉ cấp khi phiên chạy trong gVisor (ADR-0016). Capability không có trong `SESSION_ALLOWED_CAPABILITIES` của bản cài đặt bị từ chối với 422 `ENVIRONMENT_NOT_ALLOWED`.
      type: array
      uniqueItems: true
      items:
        type: string
        enum: [NET_ADMIN]
      default: []

    RenderedEnvironment:
      description: Phần `environment` của đặc tả bài lab sau khi kết xuất tham số, kèm script lỗi cài sẵn đã chọn. M1 không nhận tham số hay bước. Tổng kích thước tệp và setup không vượt 256 KiB.
      type: object
      additionalProperties: false
      required: [image, profile, ttlMinutes, idleMinutes, maxExtensionMinutes, network]
      properties:
        image:
          description: Image bài lab; phải thuộc danh sách tiền tố được phép của bản cài đặt, nếu không trả 422 `ENVIRONMENT_NOT_ALLOWED`.
          type: string
          minLength: 1
        profile:
          $ref: '#/components/schemas/Profile'
        ttlMinutes:
          description: >-
            Thời hạn phiên. Phiên `PRACTICE`, `LAB_CI` dùng giá trị của đặc tả bài lab (tối đa 180). Phiên `EXAM` được M2
            đặt bằng số phút tới `sessionUntil` của lượt thi; lượt thi kết thúc khi M3 nộp bài, thời hạn phiên chỉ là giới
            hạn an toàn.
          type: integer
          minimum: 10
          maximum: 480
        idleMinutes:
          type: integer
          minimum: 5
          maximum: 60
        maxExtensionMinutes:
          type: integer
          minimum: 0
          maximum: 60
        network:
          type: string
          enum: [none, mirror]
        cpuIntensive:
          description: Bài lab khai báo dùng CPU cao kéo dài có chủ đích; phiên không bị giám sát CPU bất thường.
          type: boolean
          default: false
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        files:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [path, content, mode]
            properties:
              path:
                type: string
              content:
                type: string
              mode:
                type: string
        setup:
          description: Script chạy sau khi ghi tệp; gồm setup và script lỗi cài sẵn đã nối theo thứ tự.
          type: string
          maxLength: 65536

    SessionCreate:
      type: object
      additionalProperties: false
      required: [ownerUserId, priority, quotaAccountRef, environment]
      properties:
        ownerUserId:
          type: string
          format: uuid
        priority:
          $ref: '#/components/schemas/Priority'
        quotaAccountRef:
          $ref: '#/components/schemas/Ref'
        reservationRef:
          $ref: '#/components/schemas/Ref'
        recordInput:
          description: Phát sự kiện dòng lệnh đã nhập (chỉ dùng cho phiên thi).
          type: boolean
          default: false
        labels:
          description: Nhãn tự do của bên gọi, trả lại nguyên vẹn trong sự kiện (ví dụ `attemptId`).
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            maxLength: 128
        environment:
          $ref: '#/components/schemas/RenderedEnvironment'

    Session:
      type: object
      required: [id, phase, priority, ownerUserId, createdAt, labels]
      properties:
        id:
          type: string
          format: uuid
        phase:
          $ref: '#/components/schemas/Phase'
        priority:
          $ref: '#/components/schemas/Priority'
        ownerUserId:
          type: string
          format: uuid
        queuePosition:
          description: Chỉ có khi pha là `PENDING` và yêu cầu đang chờ sức chứa.
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        endReason:
          $ref: '#/components/schemas/EndReason'
        failureDetail:
          type: string
        resourceUsage:
          $ref: '#/components/schemas/ResourceUsage'
        labels:
          type: object
          additionalProperties:
            type: string

    ResourceUsage:
      description: Mức dùng tài nguyên đo được của phiên, lấy mẫu mỗi 15 giây; có từ khi phiên sẵn sàng (CR-MOD-M1 mục 5.5).
      type: object
      required: [memoryPeakBytes, memoryLimitBytes, oomKilled]
      properties:
        memoryPeakBytes:
          description: Bộ nhớ làm việc cao nhất đã đo, không gồm chi phí gVisor.
          type: integer
          format: int64
        memoryLimitBytes:
          description: Giới hạn bộ nhớ của mức tài nguyên.
          type: integer
          format: int64
        oomKilled:
          description: Môi trường bị dừng vì vượt giới hạn bộ nhớ.
          type: boolean

    ResourceViolation:
      type: object
      required: [id, sessionId, ownerUserId, priority, detectedAt, cpuRatio, action]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        priority:
          $ref: '#/components/schemas/Priority'
        detectedAt:
          type: string
          format: date-time
        cpuRatio:
          description: CPU dùng trung bình trong cửa sổ phát hiện so với giới hạn CPU của phiên.
          type: number
        action:
          description: WARNED - đã cảnh báo, mức dùng giảm trong thời gian chờ; TERMINATED - phiên luyện tập bị kết thúc; REPORTED - phiên thi, đã báo giám thị.
          type: string
          enum: [WARNED, TERMINATED, REPORTED]

    ExecRequest:
      type: object
      additionalProperties: false
      required: [script, timeoutSeconds, purpose]
      if:
        properties:
          purpose:
            const: CHECK
      then:
        properties:
          timeoutSeconds:
            maximum: 15
      properties:
        machine:
          $ref: '#/components/schemas/MachineName'
        purpose:
          description: CHECK chạy lệnh kiểm tra bằng bộ công cụ chỉ đọc, thời hạn tối đa 15 giây; RESTORE chạy lời giải mẫu bằng /bin/sh và PATH chuẩn của môi trường để khôi phục tiến độ hoặc kiểm thử bài lab, tối đa 60 giây.
          type: string
          enum: [CHECK, RESTORE]
        script:
          type: string
          minLength: 1
          maxLength: 16384
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 60

    ExecResult:
      type: object
      required: [exitCode, timedOut, invalidCommand, stdout, stderr, durationMs]
      properties:
        exitCode:
          description: -1 khi hết thời gian.
          type: integer
        timedOut:
          type: boolean
        invalidCommand:
          description: >-
            Mã thoát 126 (tìm thấy nhưng không chạy được) hoặc 127 (không tìm thấy lệnh). Script không chạy, nên kết quả
            không phản ánh trạng thái môi trường: bên gọi xử lý như lỗi đặc tả bài lab, không ghi là chưa đạt
            (CR-DOC-03 mục 7).
          type: boolean
        stdout:
          description: Tối đa 4096 byte đầu. Đầu ra sinh sau khi tiến trình chính của script thoát không được bảo đảm.
          type: string
        stderr:
          description: Tối đa 4096 byte đầu. Đầu ra sinh sau khi tiến trình chính của script thoát không được bảo đảm.
          type: string
        durationMs:
          type: integer

    TerminalTicket:
      type: object
      required: [ticket, mode, url, expiresAt]
      properties:
        ticket:
          type: string
        mode:
          type: string
          enum: [INTERACTIVE, VIEW]
        url:
          description: Địa chỉ WebSocket kèm vé
          type: string
        expiresAt:
          type: string
          format: date-time

    ReservationCreate:
      type: object
      additionalProperties: false
      required: [reservationRef, quotaAccountRef, profile, slots, startsAt, endsAt, warmImages]
      properties:
        reservationRef:
          $ref: '#/components/schemas/Ref'
        quotaAccountRef:
          description: Tài khoản hạn mức của lớp; ngân sách đặt trước được tính ở tài khoản gốc của nó.
          $ref: '#/components/schemas/Ref'
        profile:
          $ref: '#/components/schemas/Profile'
        slots:
          type: integer
          minimum: 1
          maximum: 200
        warmImages:
          description: Image của các bài lab trong kỳ thi; M1 kéo sẵn các image này lên máy chạy phiên trước giờ bắt đầu.
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
        warmCapabilities:
          description: Capability bổ sung của bài lab trong kỳ thi (`capabilities` của LabSummary); M1 kiểm tra trước các capability này thuộc `SESSION_ALLOWED_CAPABILITIES`.
          allOf:
            - $ref: '#/components/schemas/Capabilities'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time

    Reservation:
      type: object
      required: [id, reservationRef, quotaAccountRef, profile, slots, startsAt, endsAt, slotsInUse, slotHours]
      properties:
        id:
          type: string
          format: uuid
        reservationRef:
          $ref: '#/components/schemas/Ref'
        quotaAccountRef:
          $ref: '#/components/schemas/Ref'
        slotHours:
          description: Số chỗ × số giờ của khung giờ, làm tròn lên theo nửa giờ.
          type: number
        profile:
          $ref: '#/components/schemas/Profile'
        slots:
          type: integer
        slotsInUse:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time

    QuotaAccount:
      type: object
      required: [quotaAccountRef, weeklyMinutes, maxConcurrentSessions, usedMinutesThisWeek, activeSessions, weekStartsAt]
      properties:
        quotaAccountRef:
          $ref: '#/components/schemas/Ref'
        parentRef:
          $ref: '#/components/schemas/Ref'
        allocatedWeeklyMinutes:
          description: Tổng `weeklyMinutes` đã chia cho các tài khoản con; chỉ có với tài khoản có con.
          type: integer
        monthlyReservationSlotHours:
          description: Chỉ có với tài khoản không có cha.
          type: integer
        usedReservationSlotHoursThisMonth:
          description: Chỉ có với tài khoản không có cha; gồm đặt trước của mọi tài khoản con.
          type: number
        weeklyMinutes:
          type: integer
        maxConcurrentSessions:
          type: integer
        usedMinutesThisWeek:
          type: integer
        activeSessions:
          type: integer
        weekStartsAt:
          type: string
          format: date-time

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          examples: [SESSION_LIMIT, QUOTA_EXHAUSTED]
        traceId:
          type: string
        capacity:
          description: Chỉ có với `CAPACITY_UNAVAILABLE`.
          $ref: '#/components/schemas/CapacityShortage'

    CapacityShortage:
      type: object
      required: [profile, requiredSlots, availableSlots]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        requiredSlots:
          type: integer
        availableSlots:
          description: Số chỗ còn có thể đặt trước trong khung giờ yêu cầu (đã trừ đặt trước khác và phần dành cho luyện tập).
          type: integer

    SettingKey:
      description: Khóa tham số hệ thống của module; ý nghĩa, mặc định và khoảng hợp lệ tại CR-DOC-01 mục 5.6.
      type: string
      enum: [queue.timeoutMinutes, reservation.maxCapacityRatio, reservation.leadMinutes, quota.defaultWeeklyMinutes, quota.defaultMaxConcurrentSessions, quota.defaultReservationSlotHours, cpuAbuse.ratio, cpuAbuse.windowMinutes, cpuAbuse.graceMinutes]

    Setting:
      type: object
      required: [key, value, defaultValue, minimum, maximum, unit, description, updatedAt]
      properties:
        key:
          $ref: '#/components/schemas/SettingKey'
        value:
          type: number
        defaultValue:
          type: number
        minimum:
          type: number
        maximum:
          type: number
        unit:
          type: string
          enum: [MINUTES, DAYS, RATIO, COUNT, SLOT_HOURS]
        description:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          description: Người sửa gần nhất; không có khi tham số chưa từng được sửa.
          type: string
          format: uuid

    SettingUpdate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: number

    SettingChange:
      type: object
      required: [key, oldValue, newValue, changedAt, changedBy]
      properties:
        key:
          $ref: '#/components/schemas/SettingKey'
        oldValue:
          type: number
        newValue:
          type: number
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
          format: uuid
