name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dev: ${{ steps.filter.outputs.dev }}
      content: ${{ steps.filter.outputs.content }}
      learning: ${{ steps.filter.outputs.learning }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dev:
              - 'dev/**'
              - '.devcontainer/**'
            content:
              - 'services/content/**'
              - 'libs/java/**'
              - 'contracts/**'
            learning:
              - 'services/learning/**'
              - 'libs/java/**'
              - 'contracts/**'
            web:
              - 'web/**'
              - 'contracts/**'

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint đặc tả OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint contracts/runtime-api.yaml contracts/content-api.yaml
      - name: Kiểm tra đặc tả AsyncAPI
        run: npx --yes @asyncapi/cli@2.16.0 validate contracts/events.asyncapi.yaml --fail-severity=error
      - name: Kiểm tra đặc tả bài lab
        run: |
          pip install --quiet jsonschema==4.23.0 pyyaml==6.0.2
          shopt -s nullglob
          python3 contracts/lab-spec/validate.py contracts/lab-spec/examples/*.yaml labs/*/lab.yaml

  dev-env:
    name: dev-env
    needs: changes
    if: needs.changes.outputs.dev == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Khởi động dịch vụ phụ thuộc
        run: |
          cp dev/.env.example dev/.env
          docker compose -f dev/compose.yaml up -d --wait
      - name: Kiểm tra dịch vụ phụ thuộc
        run: ./dev/check.sh
      - name: Log khi thất bại
        if: failure()
        run: docker compose -f dev/compose.yaml logs

  content:
    name: content
    needs: changes
    if: needs.changes.outputs.content == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Biên dịch, sinh mã từ hợp đồng, kiểm thử
        run: ./gradlew --no-daemon build

  learning:
    name: learning
    needs: changes
    if: needs.changes.outputs.learning == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Biên dịch, sinh mã từ hợp đồng, kiểm thử
        run: ./gradlew --no-daemon build

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Kiểm tra kiểu (sinh kiểu từ hợp đồng)
        run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
